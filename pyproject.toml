[project]
name = "adatta"
version = "0.1.0"
description = "Probabilistic football forecasting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "tenacity>=8.3",
  "boto3>=1.34",
  "polars>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "numpy>=2.5.4",
  "scipy>=1.18.1",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml",
  "types-boto3",
  "respx>=0.21",
  "scipy-stubs>=1.18.1.1",
  "pre-commit>=4.7.0",
]
# Bayesian stack (Phase 1b, D10, D13). Linux only: JAX and numba ship no Intel-Mac builds,
# so it runs in the Docker image (docker/model.Dockerfile) and on GitHub runners.
model = [
    "arviz>=1.3.0",
    "h5netcdf>=1.8.2",
    "h5py>=3.16.0",
    "jax>=0.12.0.1",
    "numpyro>=0.22.0",
    "pymc>=6.4.0",
]

[project.scripts]
adatta = "adatta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adatta"]

[tool.ruff]
extend-exclude = ["migrations/versions"]
force-exclude = true  # honour the exclude even when pre-commit passes file paths
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# model group (Linux / Docker only, D13): not installed on the Intel Mac
module = ["pymc.*", "pytensor.*", "arviz.*", "numpyro.*", "jax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
