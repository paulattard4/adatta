# P3b-3 (docs/PHASE3B_TASKS.md, D66): team cards with referee strictness. Manual dispatch
# only, one stage per run:
#   dev     one job per bundle x dev season x part: C0, C1, C2 (and C2 at prior x0.5 / x2)
#           on the 28-day Mondays, every n-th refit from the part's i-th, scored with B_clim
#           at T-60m and T-24h; then the dev gate. D69 (b): a CMP refit takes about 40 min
#           on CI, so a bundle-season is split in parts (default 3, about 2.5 h a job)
#   window  window (i), 2026/27 kickoff before 2026-11-27: one job per bundle, then the
#           judgement, read once and only after a dev pass (input dev = that run's id)
# The cards table is built beforehand, locally (python -m adatta.features.cards), and named
# by its digest. The repo is public: logs carry metrics only; per-match rows go to R2
# (cards/...). Holdout seasons are refused.
# One backtest-type run at a time (backtest, gate, holdout, timing, cups, selection,
# selection_rerun, formation, rates, lineup, lineup_j, continental, cards), never on a
# Monday: two runs together fill the account's 20 job slots and starve the capture.
name: cards
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "dev | window"
        required: true
      table:
        description: "cards table digest (features/cards/v1; latest = newest)"
        default: "latest"
      bundles:
        description: "JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "dev: JSON list of dev seasons"
        default: "[2019,2020,2021,2022,2023]"
      dev:
        description: "window: the passing dev run's id"
        default: ""
      parts:
        description: "dev: JSON list of parts i/n (n the same in all)"
        default: '["0/3","1/3","2/3"]'
permissions:
  contents: read
concurrency:
  group: cards
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  dev:
    if: ${{ inputs.stage == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.cards run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --upload ${{ github.run_id }} --table ${{ inputs.table }}
  assemble:
    needs: dev
    if: ${{ !cancelled() && inputs.stage == 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: dev gate
        env:
          PARTS: ${{ inputs.parts }}
        run: >-
          uv run --frozen --group model python -m adatta.model.cards assemble
          --fetch ${{ github.run_id }} --table ${{ inputs.table }}
          --parts "$(python3 -c 'import json,os; print(json.loads(os.environ["PARTS"])[0].split("/")[1])')"
          | tee -a "$GITHUB_STEP_SUMMARY"
  window:
    if: ${{ inputs.stage == 'window' && inputs.dev != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score window (i)
        run: >-
          uv run --frozen --group model python -m adatta.model.cards window
          --bundle ${{ matrix.bundle }} --upload ${{ github.run_id }} --table ${{ inputs.table }}
  judge:
    needs: window
    if: ${{ !cancelled() && inputs.stage == 'window' && needs.window.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: window (i), once
        run: >-
          uv run --frozen --group model python -m adatta.model.cards judge
          --fetch ${{ github.run_id }} --dev ${{ inputs.dev }} --table ${{ inputs.table }}
          | tee -a "$GITHUB_STEP_SUMMARY"
