# P3-j step 2 (docs/PHASE3_TASKS.md P3-j (c), D65): J, the production 1b (P) with the
# lineup signals that passed step 1 in the likelihood, against P on the weekly dev
# walk-forward. P comes from its cached refits (P3-d's run; fitted only if missing). Manual
# dispatch only, one stage per run:
#   fit   one job per bundle x dev season x part (J fitted per weekly refit, P read from
#         the cache, both scored at T-60m and T-24h), then step 2's rule
#   redo  the base fit run's J refits that fail the gates, redone once with target_accept
#         0.99 and 4,000 draws (the list read from R2, not typed), then the rule over the
#         base run with them swapped in
# The signals table is built beforehand, locally (python -m adatta.features.lineup_signals
# --step2 --export REPORT), and named by its digest.
# The repo is public: logs and artifacts carry metrics only. Per-match rows go to R2
# (lineup_j/...), never to workflow artifacts. Holdout seasons are refused.
# One backtest-type run at a time (backtest, gate, holdout, timing, cups, selection,
# selection_rerun, formation, rates, lineup, lineup_j, continental), never on a Monday:
# two runs together fill the account's 20 job slots and starve the capture.
name: lineup_j
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "fit | redo"
        required: true
      table:
        description: "signals table digest (features/lineup_signals/v2; latest = newest)"
        default: "latest"
      bundles:
        description: "JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "JSON list of dev seasons"
        default: "[2019,2020,2021,2022,2023]"
      parts:
        description: "JSON list of parts (i/n) per bundle-season"
        default: '["0/4","1/4","2/4","3/4"]'
      assemble:
        description: "fit: apply the rule after the fits (false for a timing pilot)"
        default: "true"
      base:
        description: "redo: the finished fit run whose failing J refits are redone"
        default: ""
permissions:
  contents: read
concurrency:
  group: lineup_j
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  fit:
    if: ${{ inputs.stage == 'fit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.lineup_j run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --table ${{ inputs.table }} --upload ${{ github.run_id }}
  assemble:
    needs: fit
    if: ${{ !cancelled() && inputs.stage == 'fit' && inputs.assemble == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: assemble
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.lineup_j assemble \
            --fetch ${{ github.run_id }} --bundles "$b" --seasons "$s" --parts "$n" \
            --table ${{ inputs.table }} | tee -a "$GITHUB_STEP_SUMMARY"
  plan:
    if: ${{ inputs.stage == 'redo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      refits: ${{ steps.failing.outputs.refits }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: failing J refits of the base run
        id: failing
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          r=$(uv run --frozen --group model python -m adatta.model.lineup_j failing \
            --fetch ${{ inputs.base }} --bundles "$b" --seasons "$s" --parts "$n" | tail -1)
          echo "$r" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "refits=$r" >> "$GITHUB_OUTPUT"
  redo:
    needs: plan
    if: ${{ inputs.stage == 'redo' && needs.plan.outputs.refits != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.refits) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: redo J and score
        run: >-
          uv run --frozen --group model python -m adatta.model.lineup_j run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --only ${{ matrix.only }} --table ${{ inputs.table }} --upload ${{ github.run_id }}
  assemble_redo:
    needs: [plan, redo]
    if: ${{ !cancelled() && inputs.stage == 'redo' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: assemble over the base run
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.lineup_j assemble \
            --fetch ${{ inputs.base }} --override ${{ github.run_id }} --bundles "$b" \
            --seasons "$s" --parts "$n" --table ${{ inputs.table }} | tee -a "$GITHUB_STEP_SUMMARY"
