# Stage A, A3 (docs/BEYOND_LEAGUES_PLAN.md, "A3 acceptance"): cup ties as training data,
# A3 against P on the weekly dev walk-forward. Manual dispatch only, one stage per run:
#   fit   one job per bundle x dev season x part (A3 fitted per refit, P read from the P3-d
#         cache), the delta_cup prior-sensitivity fits per bundle, then the gate
#   redo  the base fit run's A3 refits that fail the sampler gates, redone once with
#         target_accept 0.99 and 4,000 draws (the list read from R2, not typed), then the
#         gate over the base run with them swapped in
# The repo is public: logs and the summary carry metrics only. Match rows go to R2
# (cups/a3/...). Holdout seasons are refused. One backtest-type run at a time, and not on a
# Monday (national_serve refits then).
name: cups_train
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "fit | redo"
        required: true
      bundles:
        description: "JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "JSON list of dev seasons"
        default: "[2019,2020,2021,2022,2023]"
      parts:
        description: "JSON list of parts (i/n) per bundle-season"
        default: '["0/4","1/4","2/4","3/4"]'
      base:
        description: "redo: the finished fit run whose failing A3 refits are redone"
        default: ""
permissions:
  contents: read
concurrency:
  group: cups_train
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  fit:
    if: ${{ inputs.stage == 'fit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.cup_train run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --upload ${{ github.run_id }}
  sensitivity:
    if: ${{ inputs.stage == 'fit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: delta_cup prior sensitivity (last dev refit, sd 0.1 and 0.5)
        run: >-
          uv run --frozen --group model python -m adatta.model.cup_train sensitivity
          --bundle ${{ matrix.bundle }} --upload ${{ github.run_id }}
  assemble:
    needs: [fit, sensitivity]
    if: ${{ !cancelled() && inputs.stage == 'fit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: gate
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.cup_train assemble \
            --fetch ${{ github.run_id }} --bundles "$b" --seasons "$s" --parts "$n" \
            | tee -a "$GITHUB_STEP_SUMMARY"
  plan:
    if: ${{ inputs.stage == 'redo' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      refits: ${{ steps.failing.outputs.refits }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: failing A3 refits of the base run
        id: failing
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          r=$(uv run --frozen --group model python -m adatta.model.cup_train failing \
            --fetch ${{ inputs.base }} --bundles "$b" --seasons "$s" --parts "$n" | tail -1)
          echo "$r" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "refits=$r" >> "$GITHUB_OUTPUT"
  redo:
    needs: plan
    if: ${{ inputs.stage == 'redo' && needs.plan.outputs.refits != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.refits) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: redo A3 and score
        run: >-
          uv run --frozen --group model python -m adatta.model.cup_train run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --only ${{ matrix.only }} --upload ${{ github.run_id }}
  assemble_redo:
    needs: [plan, redo]
    if: ${{ !cancelled() && inputs.stage == 'redo' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: gate over the base run
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.cup_train assemble \
            --fetch ${{ inputs.base }} --override ${{ github.run_id }} --bundles "$b" \
            --seasons "$s" --parts "$n" | tee -a "$GITHUB_STEP_SUMMARY"
