# Phase 1b dev backtest (PHASE1B_TASKS task 4, D9). Manual dispatch only.
# One matrix job per bundle x season refits the 1b model on the shared walk-forward plan
# (python -m adatta.model.backtest run); each refit's prediction draws are cached in R2 under
# its config hash, so a rerun or re-dispatch only fits what is missing. A final job scores
# Phase 1a on the same plan and writes the comparison.
# The repo is public: logs and artifacts carry metrics only. Match-level predictions (parts
# and the full report) go to R2, never to workflow artifacts. Holdout seasons are refused by
# the code (HoldoutLocked), whatever is typed here.
name: backtest
on:
  workflow_dispatch:
    inputs:
      structure:
        description: "team structure: strength_open (D15) or independent (spec §5.1)"
        default: strength_open
      shifts:
        description: "D16 promotion/relegation shift (strength_open only)"
        type: boolean
        default: false
      form:
        description: "AR(1) short-term form (strength_open only)"
        type: boolean
        default: false
      vs:
        description: "optional reference, RUN_ID/MODEL (e.g. 42239760464/phase1b_strength_open): its parts are fetched and every model is also compared with it"
        default: ""
      prior_scale:
        description: "prior scale (1 = production; 0.5 / 2 for the §14.5 sensitivity runs)"
        default: "1"
      bundles:
        description: "JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "JSON list of dev seasons"
        default: "[2019,2020,2021,2022,2023]"
      draws:
        description: "NUTS draws per chain (tuning steps match)"
        default: "2000"
      every_days:
        description: "refit cadence in days (28 while iterating, D14; 7 for the final run)"
        default: "28"
      record:
        description: "write model_run rows to Neon"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: backtest-${{ inputs.structure }}-${{ inputs.shifts }}-${{ inputs.form }}-${{ inputs.prior_scale }}
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # The account limit is 20 concurrent jobs and queued jobs wait for a slot, so 2 are left
      # for capture (its windows can't be recovered) and ci. The limit is per run: dispatch one
      # backtest at a time, or two runs together fill the account again.
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: refit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.backtest run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }}
          --structure ${{ inputs.structure }} --prior-scale ${{ inputs.prior_scale }}
          --every-days ${{ inputs.every_days }} --draws ${{ inputs.draws }}
          --upload ${{ github.run_id }}
          ${{ inputs.shifts && '--shifts' || '' }}
          ${{ inputs.form && '--form' || '' }}
  assemble:
    needs: refit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: assemble and compare with Phase 1a
        env:
          STRUCTURE: ${{ inputs.structure }}
          PRIOR_SCALE: ${{ inputs.prior_scale }}
          SHIFTS: ${{ inputs.shifts }}
          FORM: ${{ inputs.form }}
          VS: ${{ inputs.vs }}
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
        run: |
          names=$(uv run python -c "
          import json, os
          from adatta.model.backtest import RunSpec
          m = RunSpec(structure=os.environ['STRUCTURE'], prior_scale=float(os.environ['PRIOR_SCALE']), shifts=os.environ['SHIFTS'] == 'true', form=os.environ['FORM'] == 'true').model_name
          runs = [('${{ github.run_id }}', m)] + ([tuple(os.environ['VS'].split('/', 1))] if os.environ['VS'] else [])
          print(' '.join(f'{r}/{n}_{b}_{s}.parquet' for r, n in runs for b in json.loads(os.environ['BUNDLES']) for s in json.loads(os.environ['SEASONS'])))")
          vs=()
          if [ -n "$VS" ]; then vs=(--vs "${VS#*/}"); fi
          uv run python -m adatta.model.backtest assemble --fetch $names "${vs[@]}" --upload-report ${{ inputs.record && '--record' || '' }} \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-summary
          path: reports/phase1b/backtest/*/summary.md
