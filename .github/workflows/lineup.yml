# P3-d (docs/PHASE3_TASKS.md): the lineup offset in the likelihood (L) vs serving-only (S)
# against the production 1b (P), on the weekly dev walk-forward. Manual dispatch only, one
# stage per run:
#   quality  the P3-d0 goals hyperparameters at the warm-up refit and every dev refit
#   table    the offset table from those, the counts table and P3-b's export rerun
#   fit      one job per bundle x dev season x part (P and L fitted per weekly refit, S
#            rescored from P), then the pass rule (e)
# The repo is public: logs and artifacts carry metrics only. Per-player and per-match rows
# go to R2 (lineup/...), never to workflow artifacts. Holdout seasons are refused.
# One backtest-type run at a time (backtest, gate, holdout, timing, cups, selection,
# selection_rerun, formation, rates, lineup): two runs together fill the account's 20 job
# slots and starve the capture.
name: lineup
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "quality | table | fit"
        required: true
      quality_parts:
        description: "quality: JSON list of parts (i/n)"
        default: '["0/4","1/4","2/4","3/4"]'
      quality_run:
        description: "table: the quality run id"
        default: ""
      export:
        description: "table: the selection report id holding the P3-d export"
        default: ""
      table:
        description: "fit: offset table digest (latest = the newest stored)"
        default: "latest"
      bundles:
        description: "fit: JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "fit: JSON list of dev seasons"
        default: "[2019,2020,2021,2022,2023]"
      parts:
        description: "fit: JSON list of parts (i/n) per bundle-season"
        default: '["0/4","1/4","2/4","3/4"]'
      assemble:
        description: "fit: apply the pass rule after the fits (false for a timing pilot)"
        default: "true"
permissions:
  contents: read
concurrency:
  group: lineup
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  quality:
    if: ${{ inputs.stage == 'quality' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.quality_parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: goals hyperparameters
        run: >-
          uv run --frozen --group model python -m adatta.model.lineup quality
          --upload ${{ github.run_id }} --part ${{ matrix.part }}
  table:
    if: ${{ inputs.stage == 'table' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: offset table
        run: >-
          uv run --frozen --group model python -m adatta.model.lineup table
          --quality ${{ inputs.quality_run }} --export ${{ inputs.export }}
  fit:
    if: ${{ inputs.stage == 'fit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.lineup run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --table ${{ inputs.table }} --upload ${{ github.run_id }}
  assemble:
    needs: fit
    if: ${{ !cancelled() && inputs.stage == 'fit' && inputs.assemble == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: assemble
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.lineup assemble \
            --fetch ${{ github.run_id }} --bundles "$b" --seasons "$s" --parts "$n" \
            --table ${{ inputs.table }} | tee -a "$GITHUB_STEP_SUMMARY"
