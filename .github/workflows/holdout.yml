# Phase 1b locked holdout (PHASE1B_TASKS acceptance item 3; spec §14.3; D18, D28). Manual
# dispatch only, once. The first job claims the holdout for this run id in R2
# (backtest/holdout/opened.json); any other run is refused by the code, so a second dispatch
# fails at its first step. Failed or timed-out jobs of THIS run may be rerun (same run id),
# resuming from the R2 refit cache.
# Scores the production spec only (phase1b_strength_open_xg, prior scale 1, weekly cadence)
# on 2024/25 and 2025/26, with Phase 1a on the same grid, then applies the pre-registered
# gate from config/evaluation.yml and records champion / rejected in model_run.
# opening phase2 (D30, the second opening; its own marker and confirm phrase): scores the
# promotion spec pinned in config/phase2_promotion.yml and the production spec again on this
# code as its reference, then applies the D36 gate (config/phase2_gate.yml).
# opening c2 (C2 step 2 (g), D52; its own marker and confirm phrase): scores the production
# spec on the eight C2 bundles (top flights as targets), then applies config/c2_gate.yml per
# top flight and records each as champion or rejected.
# The repo is public: logs carry metrics only; match-level parts and the report go to R2.
# `parts` splits each bundle-season into jobs (assemble fetches every piece and refuses a
# missing or repeated one).
# One heavy workflow at a time: don't dispatch this while a backtest or gate run is going.
name: holdout
on:
  workflow_dispatch:
    inputs:
      opening:
        description: "phase1b (made 2026-11-11), phase2 (D30) or c2 (D52)"
        type: choice
        options: [phase2, phase1b, c2]
        default: phase2
      confirm:
        description: 'type "open the locked holdout once" (phase1b), "open the locked holdout for phase 2 once" (phase2) or "open the locked holdout for c2 once" (c2)'
        required: true
      parts:
        description: 'JSON list of pieces per bundle-season, K/N: ["0/1"] = whole; ["0/2","1/2"] halves each (weekly fits of the biggest bundle-seasons outlast 6 h)'
        default: '["0/1"]'
permissions:
  contents: read
concurrency:
  group: holdout
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  claim:
    if: >-
      ${{ (inputs.opening == 'phase1b' && inputs.confirm == 'open the locked holdout once') ||
          (inputs.opening == 'phase2' && inputs.confirm == 'open the locked holdout for phase 2 once') ||
          (inputs.opening == 'c2' && inputs.confirm == 'open the locked holdout for c2 once') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: >-
          uv run python -m adatta.model.backtest claim-holdout --run-id ${{ github.run_id }}
          --opening ${{ inputs.opening }}
  refit:
    needs: claim
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Same budget as backtest.yml: 18 of the account's 20 concurrent jobs.
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.opening == 'c2' && '["portugal","netherlands","belgium","austria","scotland","turkey","czechia","denmark"]' || '["england","spain","italy","germany","france"]') }}
        season: [2024, 2025]
        part: ${{ fromJSON(inputs.parts) }}
        spec: ${{ fromJSON(inputs.opening == 'phase2' && '["production","promotion"]' || '["production"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: refit and score the holdout
        run: >-
          uv run --frozen --group model python -m adatta.model.backtest run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --every-days 7 --holdout ${{ github.run_id }} --upload ${{ github.run_id }}
          --opening ${{ inputs.opening }} ${{ matrix.spec == 'promotion' && '--promotion' || '' }}
  assemble:
    needs: refit
    if: ${{ !cancelled() && needs.refit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: score Phase 1a, apply the pre-registered gate, record the verdict
        run: |
          names=$(uv run python -c "
          from adatta.eval import harness
          from adatta.model.backtest import holdout_bundles, production_spec, promotion_spec
          cfg = harness.load_config()
          key = harness.HoldoutKey('${{ github.run_id }}', '${{ inputs.opening }}')
          specs = [production_spec(cfg)] + ([promotion_spec(cfg)] if key.opening == 'phase2' else [])
          print(' '.join(f'${{ github.run_id }}/{sp.model_name}_{b}_{s}.parquet' for sp in specs for b in holdout_bundles(cfg, key) for s in cfg.holdout_seasons))")
          uv run python -m adatta.model.backtest assemble --fetch $names \
            --holdout ${{ github.run_id }} --opening ${{ inputs.opening }} \
            --upload-report --record | tee -a "$GITHUB_STEP_SUMMARY"
