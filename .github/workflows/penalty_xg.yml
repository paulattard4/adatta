# P3-k (docs/PHASE3_TASKS.md, D71): Q, P fitted on penalty-free xG (0.76 per penalty taken),
# against P on the dev seasons whose refits see xG (2022, 2023), P's weekly grid. P read
# from its cached refits, Q fitted (a failing Q refit redone once in the same job at
# target_accept 0.99, 4,000 draws), then the rule (P3-j step 2's, with Q as challenger).
# Dev decides only whether Q is judged live (D59, season end). Manual dispatch only.
# The repo is public: logs carry metrics only; scored rows go to R2 (penalty_xg/...).
# One backtest-type run at a time (backtest, gate, holdout, timing, cups, selection,
# selection_rerun, formation, rates, lineup, lineup_j, continental, cards, penalty_xg),
# never on a Monday: two runs together fill the account's 20 job slots and starve capture.
name: penalty_xg
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "JSON list of dev seasons with xG"
        default: "[2022,2023]"
      parts:
        description: "JSON list of parts (i/n) per bundle-season"
        default: '["0/4","1/4","2/4","3/4"]'
permissions:
  contents: read
concurrency:
  group: penalty_xg
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.penalty_xg run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --upload ${{ github.run_id }}
  assemble:
    needs: fit
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: the rule
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.penalty_xg assemble \
            --fetch ${{ github.run_id }} --bundles "$b" --seasons "$s" --parts "$n" \
            | tee -a "$GITHUB_STEP_SUMMARY"
