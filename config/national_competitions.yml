# Senior men's national-team competitions (D35 Stage 0; docs/BEYOND_LEAGUES_PLAN.md, Stage D).
# Audited 2026-11-13 (docs/SOURCE_FEASIBILITY.md section 7):
#   uv run adatta audit --config config/national_competitions.yml
# Live capture from 2026-11-13: the capture tick loads this file next to competitions.yml. A
# competition is captured from 30 days before its current season's start to 14 days after
# its end (adatta/capture/jobs.py national_active); outside that, one /leagues request a day.
# Its teams are stored with is_national. History not loaded yet; never modelled until Stage D.
# league_id values and seasons are from API-Football /leagues?country=World (2026-11-13).
# Season years are the provider's: a qualifying competition is keyed by its finals' year or
# by its start year, whichever the provider uses (the World Cup 2018 qualifiers run 2015-17
# as season 2018; the Euro 2020 season includes its 2019 qualifiers). History starts where
# the provider's does: friendlies from 2017, the European World Cup qualifiers from Sept 2016;
# the Euro 2016 qualifiers (2014-15) are not in the source.
# Youth, women's, Olympic and regional invitational cups are out of scope (CLAUDE.md rule 10
# for youth levels; the others later, by review).
competitions:
