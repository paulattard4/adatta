# Third tiers (D35 Stage 0; docs/BEYOND_LEAGUES_PLAN.md): history for Stage A cup ties, most
# of whose early rounds involve a tier-3+ side. Backfill and audit only: this file is not read
# by the capture tick (live capture of the current season is a separate owner decision).
#   uv run adatta audit --config config/tier3_competitions.yml
#   uv run adatta backfill-run --config config/tier3_competitions.yml
# league_id values verified against /leagues on 2026-11-15. Provider names: France's tier 3
# is "Ligue 3" (the Championnat National); Spain's is in the source from 2019 only, as
# "Primera División RFEF - Group N" (Segunda B before 2021/22: 4 groups in 2019, 5 in 2020
# with group 5 under its own id; 2 groups from 2021). Serie C is one id per group (Girone B
# and C from 2018; earlier seasons sit under Girone A's id). Play-offs are separate ids.
