# Live refits of the champion (PHASE1B_TASKS sections 7 and 7b; spec §12.1; D11, D33). Each
# job refits every refit of its bundle that is due this week: Monday 00:00 UTC and any
# results trigger since (after a match day whose teams play again before Monday). The
# capture tick dispatches this workflow when one is due; the schedules below are the
# backstop (GitHub's scheduler is best-effort, D17). Production spec; draws go to R2 under
# serving/, and a model_run row (window live) records each refit and its inference gates.
# The capture tick projects from the latest passing refit (adatta.sim.serve). A refit whose
# results aren't in yet is reported "not ready" and left for the next dispatch or schedule;
# with an as_of input it fails instead.
# max-parallel 1: one runner slot at most, so a backtest running alongside (18 jobs) still
# leaves the capture poller its slot. The repo is public: logs carry metrics only.
name: serve
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "one refit time: a Monday (YYYY-MM-DD) or a trigger (YYYY-MM-DDTHH:MM, UTC); empty = everything due"
        required: false
        default: ""
  schedule:
    - cron: "17 13 * * 1"
    - cron: "17 19 * * 1"
    - cron: "17 7 * * 2"
    - cron: "17 13 * * 2"
permissions:
  contents: read
concurrency:
  group: serve
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
  # results-triggered refits (D33): repository variable, "on" once the dev backtest passes;
  # until then only the Monday refit is due
  RESULTS_REFITS: ${{ vars.RESULTS_REFITS }}
jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bundle: ["england", "spain", "italy", "germany", "france"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: refit what is due
        env:
          AS_OF: ${{ inputs.as_of }}
        run: >-
          uv run --frozen --group model python -m adatta.model.live refit
          --bundle ${{ matrix.bundle }} ${AS_OF:+--as-of "$AS_OF"}
  lineup_j:
    # P3-j step 3 (D65), shadow: J refitted at the as-of time of every passing P refit of the
    # bundle not yet matched (the latest one on the first run), after the bundle refits (also
    # when one of them failed). About 1.1x P's refit time each; nothing served. Metrics only.
    needs: refit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        bundle: ["england", "spain", "italy", "germany", "france"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: J refits due (shadow)
        run: >-
          uv run --frozen --group model python -m adatta.model.lineup_j_live refit
          --bundle ${{ matrix.bundle }}
  share:
    # P3b-2 (D51): this week's production S0 share refit as of Monday 00:00 UTC, after the
    # bundle refits (also when one of them failed); a trigger as_of has no share refit.
    # About a minute; an existing refit for the Monday is reused. Metrics only in the log.
    needs: refit
    if: ${{ always() && (inputs.as_of == '' || inputs.as_of == null || !contains(inputs.as_of, 'T')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: share refit
        env:
          AS_OF: ${{ inputs.as_of }}
        run: >-
          uv run --frozen --group model python -m adatta.model.half_split live
          ${AS_OF:+--as-of "$AS_OF"}
  c2:
    # C2 step 3 (D54): this week's Phase 1a refit of the eight C2 bundles as of Monday
    # 00:00 UTC, after the bundle refits (also when one of them failed); a trigger as_of has
    # no C2 refit (Mondays only). L-BFGS point fits, about a minute; a stored fit is reused.
    # Forecasts are written by the capture tick, for the top flights recorded as champion.
    needs: refit
    if: ${{ always() && (inputs.as_of == '' || inputs.as_of == null || !contains(inputs.as_of, 'T')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: C2 Phase 1a refit
        env:
          AS_OF: ${{ inputs.as_of }}
        run: >-
          uv run --frozen --group model python -m adatta.model.c2_live refit
          ${AS_OF:+--as-of "$AS_OF"}
