# League-season rules for importance (spec §6.2; docs/FEASIBILITY_REGISTER.md 2.20, 2.21).
# Hand-entered 2026-11-09 and checked by `adatta rules-check` against the stored final
# /standings tables (no requests). The owner should spot-check what is marked.
#
# zones: the PRE-SEASON rules, i.e. the table positions each league's format and UEFA's access
#   list fix before a ball is kicked. Final-table labels are post-season outcomes (a cup
#   winner's place passes down the table; England's extra 2024/25 Champions League place came
#   from UEFA's coefficient race), so they are not used as rules. Ranges are inclusive.
#   champion; ucl: Champions League places by league position; europe: every UEFA place
#   guaranteed by league position (cup-winner knock-ons excluded); promotion (automatic);
#   promotion_playoff; relegation_playoff (a play-off against a lower-league side, or Serie
#   B's play-out); relegation (automatic). A season absent from a league's list has no rule
#   and importance stays off for it.
# deductions: points taken (positive) or restored (negative) during a league-season, from the
#   gap between 3*W + D and points in the final standings. `effective` is the date the
#   change applied to the table; date_confidence: high (decision date known), approximate
#   (within weeks), unknown (`effective: null`, applied after the season's last match, so a
#   backtest never sees it early).
# var_from: first season (start year) with VAR in every match. null: not in every match through
#   2026/27 so far.
#
# 2026/27 (added 2026-11-11): every league keeps its 2025/26 team count (checked against the
#   stored fixtures) and format, so each 2025/26 rule is extended to 2026. Assumes UEFA's
#   2027/28 access list gives each league the same places by position as 2026/27; the extra
#   Champions League places from the coefficient race are excluded as before. Owner to review.

leagues:
  - league_id: 39  # Premier League
    var_from: 2019
    seasons:
      - {years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026], teams: 20, champion: [1, 1], ucl: [1, 4], europe: [1, 5], relegation: [18, 20]}
