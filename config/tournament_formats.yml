# D v2 tournament formats (docs/BEYOND_LEAGUES_PLAN.md, "D v2 acceptance"). Generated
# 2026-11-24 from the editions' Wikipedia pages (`source`) and the stored fixtures; nothing is
# read from results except the path played, to name later bracket rounds.
# groups: published final order (the replay's target). group_rank / thirds.rank: criteria in
# order after points: h2h = head-to-head points, goal difference and goals among the tied teams,
# re-applied to a subset still level; h2h_pts / h2h_gd / h2h_gf one at a time among the teams
# level when the first is reached; gd, gf, wins over all group matches; random = what the data
# can't decide (fair play, rankings, a last-round shoot-out, lots), drawn at random.
# thirds.table: qualifying groups -> the group of the third-placed team each column meets.
# rounds[].basis: stated = the slots as the source lists them; derived = from the path played
# (the sources give these rounds only as match reports). extra_time false: 90' then penalties.
editions:
  asian2019:
    name: AFC Asian Cup 2019
    league_id: 7
    season: 2019
    start: '2019-01-05'
    end: '2019-02-01'
    window: dev
    source: https://en.wikipedia.org/wiki/2019_AFC_Asian_Cup
    groups:
      A: [United Arab Emirates, Thailand, Bahrain, India]
      B: [Jordan, Australia, Palestine, Syria]
      C: [South Korea, China, Kyrgyzstan, Philippines]
      D: [Iran, Iraq, Vietnam, Yemen]
      E: [Qatar, Saudi Arabia, Lebanon, North Korea]
      F: [Japan, Uzbekistan, Oman, Turkmenistan]
    group_rank: [h2h, gd, gf, random]
    thirds:
      count: 4
      rank: [pts, gd, gf, random]
      columns: [1A, 1B, 1C, 1D]
      table:
        ABCD: CDAB
        ABCE: CABE
        ABCF: CABF
        ABDE: DABE
        ABDF: DABF
        ABEF: EABF
        ACDE: CDAE
        ACDF: CDAF
        ACEF: CAFE
        ADEF: DAFE
        BCDE: CDBE
        BCDF: CDBF
        BCEF: ECBF
        BDEF: EDBF
        CDEF: CDFE
    rounds:
    - round: R16
      basis: stated
      extra_time: true
      matches:
        R16_1: [2A, 2C]
        R16_2: [1D, 3BEF]
        R16_3: [1B, 3ACD]
        R16_4: [1F, 2E]
        R16_5: [1C, 3ABF]
        R16_6: [1E, 2D]
        R16_7: [1A, 3CDE]
        R16_8: [2B, 2F]
    - round: QF
      basis: derived
      extra_time: true
      matches:
        QF_1: ['W:R16_3', 'W:R16_4']
        QF_2: ['W:R16_1', 'W:R16_2']
        QF_3: ['W:R16_5', 'W:R16_6']
