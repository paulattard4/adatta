# Snapshot capture poller (D2, spec §19.2 step 4). Each run captures whatever is due and is
# idempotent, so overlapping or repeated runs are harmless.
# Hosting: the repo is public, so Actions minutes are free (a 15-minute cron on a private repo
# would need ~2,900 billed minutes/month against GitHub Free's 2,000).
# Offset minutes avoid the top-of-hour rush, but GitHub's schedule is best-effort and fired only
# 5 of ~126 ticks on 2026-11-05/06, so it can't be relied on alone (D17). Any window a delayed
# run misses is reported by the missed-capture alert. Secrets are not exposed
# to fork pull requests, and only users with write access can trigger workflow_dispatch.
name: capture
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
# actions: write lets the tick start serve.yml when a results-triggered refit is due (D33);
# the run's own GITHUB_TOKEN, scoped to this repository and this run.
permissions:
  contents: read
  actions: write
concurrency:
  group: capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    # Under the 15-minute tick, so at most one run is ever pending. run_capture stops starting
    # daily jobs after 8 minutes, leaving this margin for the last competition and the odds.
    timeout-minutes: 14
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      RESULTS_REFITS: ${{ vars.RESULTS_REFITS }}  # "on" once the D33 dev backtest passes
      STORAGE_BACKEND: r2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --no-dev
      # exits non-zero on a missed milestone or job error, so the run fails visibly
      - run: uv run adatta capture
