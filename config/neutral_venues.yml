  - {fixture: 121534, role: home, note: "Chauray at their ground"}
  - {fixture: 1141259, role: home, note: "Villejuif at their ground"}
  - {fixture: 1647976, role: home, note: "Gobelins (Paris 13e) at Charlety, their district"}
  - {fixture: 716598, role: home, note: "Stevenage at their ground (Lamex Stadium)"}
  - {fixture: 716597, role: home, note: "Leyton Orient at Brisbane Road (sponsor name)"}
  - {fixture: 629206, role: home, note: "Leyton Orient at Brisbane Road (sponsor name)"}
  - {fixture: 1141470, role: home, note: "Cray Valley PM at their ground"}
  - {fixture: 209848, role: home, note: "AFC Wimbledon at Kingsmeadow, their ground then"}
  - {fixture: 209825, role: home, note: "AFC Wimbledon at Kingsmeadow, their ground then"}
