# P3-c (docs/PHASE3_TASKS.md): the formation model on the dev walk-forward, against two
# baselines fixed on warm-up. Manual dispatch only. One matrix job per bundle x dev season
# (x part) fits that season's 28-day refits (python -m adatta.model.formation run) from the
# stored formation table; a final job applies the pass rule, which also reads the stored
# slot-code, tenure, role-assignment and leakage checks.
# The repo is public: logs and artifacts carry metrics only. Scored rows go to R2
# (formation/parts, formation/reports), never to workflow artifacts. Holdout seasons are
# refused by the code.
# One backtest-type run at a time (backtest, gate, holdout, timing, cups, selection,
# selection_rerun, formation): two runs together fill the account's 20 job slots and
# starve the capture.
name: formation
on:
  workflow_dispatch:
    inputs:
      bundles:
        description: "JSON list of bundles"
        default: '["england","spain","italy","germany","france"]'
      seasons:
        description: "JSON list of dev seasons"
        default: "[2019,2020,2021,2022,2023]"
      parts:
        description: "JSON list of parts (i/n) per season"
        default: '["0/1"]'
      draws:
        description: "NUTS draws per chain"
        default: "500"
      table:
        description: "formation table digest (latest = the newest stored)"
        default: "latest"
      assemble:
        description: "apply the pass rule after the fits (false for a timing pilot)"
        default: "true"
permissions:
  contents: read
concurrency:
  group: formation
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        bundle: ${{ fromJSON(inputs.bundles) }}
        season: ${{ fromJSON(inputs.seasons) }}
        part: ${{ fromJSON(inputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: fit and score
        run: >-
          uv run --frozen --group model python -m adatta.model.formation run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }} --part ${{ matrix.part }}
          --draws ${{ inputs.draws }} --table ${{ inputs.table }} --upload ${{ github.run_id }}
  assemble:
    needs: fit
    if: ${{ !cancelled() && inputs.assemble == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: assemble
        env:
          BUNDLES: ${{ inputs.bundles }}
          SEASONS: ${{ inputs.seasons }}
          PARTS: ${{ inputs.parts }}
        run: |
          b=$(echo "$BUNDLES" | uv run python -c "import json,sys; print(','.join(json.load(sys.stdin)))")
          s=$(echo "$SEASONS" | uv run python -c "import json,sys; print(','.join(map(str, json.load(sys.stdin))))")
          n=$(echo "$PARTS" | uv run python -c "import json,sys; print(len(json.load(sys.stdin)))")
          uv run --frozen --group model python -m adatta.model.formation assemble \
            --fetch ${{ github.run_id }} --bundles "$b" --seasons "$s" --parts "$n" \
            --table ${{ inputs.table }} | tee -a "$GITHUB_STEP_SUMMARY"
