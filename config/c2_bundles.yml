# C2 step 2 (D49, D52; docs/BEYOND_LEAGUES_PLAN.md "C2 step 2 acceptance"): the eight new
# bundles, each a top flight plus its second tier fitted jointly as for the five. Kept apart
# from evaluation.yml, which is part of every fit's cache hash: this file and
# adatta/eval/c2.py join the hash of C2 bundles only (adatta.model.backtest.bundle_hash).
# Windows, lookback, lag and Phase 1a settings are evaluation.yml's.
#
# Targets are top-flight matches only (the first league of each bundle). Second tiers are
# training rows only, and only as production sees them: loaded once a summer, so a second-tier
# match is observable from `second_tier_available` (month-day) after its season.
#
# rounds: every round-label family seen 2016-2026 (the label with a trailing " - <n>"
# stripped), per league, classed as
#   regular   the regular season (or its halves, Belgium's Opening / Closing 2016-2019)
#   phase     a post-split league phase: home-and-away round robins between the same league's
#             sides. A phase match counts only if both sides played that league-season's
#             regular season, and a phase group (connected sides) with fewer than three sides
#             is a tie, not a phase: both are dropped by rule (cross-tier play-offs share
#             labels with groups in Czechia, Scotland and Belgium).
#   excluded  knockout ties (play-offs, European play-offs, finals), and Belgium's 2018/19
#             Play-offs II ("Group Stage"), which mixed in second-tier sides.
# A label not listed here fails loading (tests/test_c2.py).
second_tier_available: "07-01"

bundles:
  portugal: [94, 95]
  netherlands: [88, 89]
  belgium: [144, 145]
  austria: [218, 219]
  scotland: [179, 180]
  turkey: [203, 204]
  czechia: [345, 346]
  denmark: [119, 120]

rounds:
  94:   # Primeira Liga
    Regular Season: regular
    Relegation Round: excluded   # play-off against Liga Portugal 2
    Final: excluded
  95:   # Liga Portugal 2
    Regular Season: regular
    Relegation Round: excluded   # play-off against Liga 3
    Final: excluded
  88:   # Eredivisie
    Regular Season: regular
    Relegation Round: excluded   # promotion / relegation play-offs with the Eerste Divisie
    1st Round: excluded
    2nd Round: excluded
    3rd Round: excluded
    Europa League Play-offs - Semi-finals: excluded
    Europa League Play-offs - Finals: excluded
    Europa League Play-offs - Final: excluded
    Conference League Play-offs - Semi-finals: excluded
    Conference League Play-offs - Final: excluded
    Semi-finals: excluded
    Final: excluded
  89:   # Eerste Divisie
    Regular Season: regular
    Round of 16: excluded
    Quarter-finals: excluded
    Semi-finals: excluded
    Final: excluded
  144:  # Jupiler Pro League
    Regular Season: regular
    Play-offs I: phase
    Championship Round: phase
    Championship Group: phase
    Conference League Play-off Group: phase
    Conference League Group: phase
    Relegation Round: phase        # 2020-2021: a cross-tier tie, dropped by rule
    Relegation Group: phase
    Group Stage: excluded          # 2018/19 Play-offs II, mixed with second-tier sides
    Conference League Play-offs - Final: excluded
    Quarter-finals: excluded
    Semi-final: excluded
    Semi-finals: excluded
    Final: excluded
  145:  # Challenger Pro League
    Regular Season: regular
    Opening: regular
    Closing: regular
    Promotion Round: phase
    Relegation Round: phase        # 2019: a two-side tie, dropped by rule
    Promotion Play-offs - Semi-finals: excluded
    Promotion Play-offs - Finals: excluded
    Promotion Play-offs - Final: excluded
  218:  # Austrian Bundesliga
    Regular Season: regular
    Championship Round: phase
    Championship Group: phase
    Relegation Round: phase
    Relegation Group: phase
    Europa League Play-offs - 1st Round: excluded
    Europa League Play-offs - Final: excluded
    Conference League Play-offs - 1st Round: excluded
    Conference League Play-offs - Final: excluded
    Semi-finals: excluded
    Final: excluded
  219:  # Austrian 2. Liga
    Regular Season: regular
  179:  # Scottish Premiership
    Regular Season: regular
    1st Phase: regular
    2nd Phase: phase
    Championship Round: phase
    Championship Group: phase
    Relegation Round: phase        # holds the play-off against Championship sides too: dropped by rule
    Relegation Group: phase
    Relegation/Promotion: excluded
    Quarter-finals: excluded
    Semi-finals: excluded
    Final: excluded
  180:  # Scottish Championship
    Regular Season: regular
    Relegation Round: excluded     # play-offs with League One
    Semi-finals: excluded
    Final: excluded
  203:  # Super Lig
    Regular Season: regular
  204:  # Turkish 1. Lig
    Regular Season: regular
    Promotion Play-offs - 1st Round: excluded
    Promotion Play-offs - 2nd Round: excluded
    Promotion Play-offs - Semi-finals: excluded
    Promotion Play-offs - Final: excluded
    Quarter-finals: excluded
    Semi-finals: excluded
    Final: excluded
  345:  # Czech Liga
    Regular Season: regular
    Championship Round: phase
    Championship Group: phase
    Relegation Round: phase        # 2021-2024 holds 4 play-off matches against FNL sides: dropped by rule
    Relegation Group: phase
    Middle Play-offs - Semi-finals: excluded
    Middle Play-offs - Final: excluded
    Europa League Play-offs - 1st Round: excluded
    Europa League Play-offs - 2nd Round: excluded
    Europa League Play-offs - Final: excluded
    Conference League Play-offs - Final: excluded
    Relegation - Final: excluded
    Semi-finals: excluded
    Final: excluded
  346:  # Czech FNL
    Regular Season: regular
  119:  # Danish Superliga
    Regular Season: regular
    Championship Round: phase
    Championship Group: phase
    Relegation Round: phase
    Relegation Group: phase
    Europa League Play-offs - Quarter-finals: excluded
    Europa League Play-offs - Semi-finals: excluded
    Europa League Play-offs - Final: excluded
    Conference League Play-offs - Final: excluded
    Relegation Play-offs - Final: excluded
    Final: excluded
  120:  # Danish 1. Division
    Regular Season: regular
    Promotion Round: phase
    Promotion Group: phase
    Relegation Round: phase
    Relegation Group: phase
