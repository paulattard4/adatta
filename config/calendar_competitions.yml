# Competitions loaded for their fixture calendar only (detail: false): no post-match detail,
# no live capture, never modelled. They exist so congestion (days since the last match, spec
# §6.2) sees every game a bundle team plays (docs/FEASIBILITY_REGISTER.md 2.16).
#   uv run adatta backfill-run --config config/calendar_competitions.yml
# league_id values are API-Football ids; each was checked against the league name in the
# /fixtures response on first load. The UEFA Conference League starts in 2021/22; the Coupe
# de la Ligue ended after 2019/20.
competitions:
