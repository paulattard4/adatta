# Stage A/B promotion (docs/BEYOND_LEAGUES_PLAN.md, Stage B amendment 1): the cup holdout
# (2024/25 and 2025/26 bundle ties), opened ONCE with its own marker ("cups",
# adatta.eval.holdout). A second dispatch is refused by the marker, whatever is typed here.
#   claim     claims the marker for this run (refused if another run made the opening)
#   score     one job per bundle x holdout season: A1 exactly as on dev (the weekly
#             production refit of each tie's Monday, fitted and cached where missing)
#   assemble  A1's holdout predictions to R2, its metrics to the summary
#   judge     the pre-registered checks: B3' (stretch walk-forward from dev), A1's 1X2
#             calibration against the noise floor; metrics and the verdict only
# The repo is public: logs and artifacts carry metrics only. Match-level rows go to R2
# (cups/parts, cups/reports), never to workflow artifacts.
# One backtest-type run at a time (backtest, gate, holdout, timing, cups, selection, ...).
name: cups_holdout
on:
  workflow_dispatch:
    inputs:
      a1:
        description: "the dev A1 run (its predictions start the stretch walk)"
        default: "43903439721"
      confirm:
        description: "type OPEN to open the cup holdout (once)"
        required: true
permissions:
  contents: read
concurrency:
  group: cups
  cancel-in-progress: false
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  STORAGE_BACKEND: r2
jobs:
  claim:
    if: ${{ inputs.confirm == 'OPEN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: claim the cup opening
        run: >-
          uv run python -m adatta.model.cup_backtest claim
          --run ${{ github.run_id }} --commit ${{ github.sha }}
  score:
    needs: claim
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        bundle: [england, spain, italy, germany, france]
        season: [2024, 2025]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --group model
      - name: score holdout cup ties
        run: >-
          uv run --frozen --group model python -m adatta.model.cup_backtest run
          --bundle ${{ matrix.bundle }} --season ${{ matrix.season }}
          --upload ${{ github.run_id }} --holdout ${{ github.run_id }}
  assemble:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: assemble A1 on the holdout
        run: >-
          uv run python -m adatta.model.cup_backtest assemble --fetch ${{ github.run_id }}
          --seasons 2024,2025 | tee -a "$GITHUB_STEP_SUMMARY"
  judge:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: the Stage A/B checks (metrics and verdict only)
        run: >-
          uv run python -m adatta.eval.knockout holdout --a1 ${{ inputs.a1 }}
          --run ${{ github.run_id }} | tee -a "$GITHUB_STEP_SUMMARY"
