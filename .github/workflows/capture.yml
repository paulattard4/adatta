# Snapshot capture poller (D2). Runs every 15 minutes; captures whatever is due.
# The capture command itself is added in Phase 0 task 5. Until then this is a disabled stub.
name: capture
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/15 * * * *"   # enable once `adatta capture` exists
jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      STORAGE_BACKEND: r2
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: echo "capture command not implemented yet"
